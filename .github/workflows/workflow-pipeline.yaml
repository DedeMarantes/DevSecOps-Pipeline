name: Workflow Pipeline do APP

on:
    push:
        branches: 
            - main
            - feature/*
    pull_request: 
        branches: 
            - main

    workflow_dispatch: 

env:
    DOCKER_USERNAME: ${{ vars.DOCKER_USERNAME }}
    DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
    GO_VERSION: '1.26.2'

jobs:
    unit-tests:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v3

            - name: Set up Go
              uses: actions/setup-go@v6
              with:
                go-version: ${{ env.GO_VERSION }}
                cache-dependency-path: app/go.mod

            - name: Run test and coverage and generate report
              continue-on-error: true
              working-directory: app
              run: |
               go install gotest.tools/gotestsum@latest
               gotestsum --junitfile unit-tests.xml -- -coverprofile=coverage.out ./...

            - name: Upload Test Report
              uses: mikepenz/action-junit-report@v6
              #Ensure this step runs even if the tests fail
              if: always()  
              with:
                report_paths: app/unit-tests.xml
            
            - name: Upload Coverage Report
              if: always()
              uses: codecov/codecov-action@v5
              with:
                files: app/coverage.out

    build:
        runs-on: ubuntu-latest
        needs: unit-tests
        permissions:
            packages: write
        steps:
          - uses: actions/checkout@v3

          - name: Login Docker Hub
            uses: docker/login-action@v2
            with:
                username: ${{ env.DOCKER_USERNAME }}
                password: ${{ env.DOCKER_PASSWORD }}
          
          - name: Login GHCR
            uses: docker/login-action@v2
            with:
                registry: ghcr.io
                username: ${{ github.repository_owner }}
                password: ${{ secrets.GITHUB_TOKEN }}

          - name: Set up Docker Buildx
            uses: docker/setup-buildx-action@v4 
            
          - name: Build Docker Image sem o push
            uses: docker/build-push-action@v3
            with:
                file: ./app/dockerfile
                push: false
                load: true
                tags: |
                 ${{ env.DOCKER_USERNAME }}/go-api:${{ github.sha }}
                context: ./app
                cache-from: type=gha
                cache-to: type=gha,mode=max
          # SECURITY SCANNING antes de dar push
          - name: Procurando Vulnerabilidades
            uses: aquasecurity/trivy-action@v0.36.0
            with:
              image-ref: ${{ env.DOCKER_USERNAME }}/go-api:${{ github.sha }}
              format: table
              exit-code: '1'
              ignore-unfixed: true
              vuln-type: 'os,library'
              severity: 'CRITICAL,HIGH'
          # Testando endpoint /health para checar se aplicação funciona antes de push
          - name: Testando /health da imagem
            env:
              DB_HOST: '127.0.0.1'
              DB_PORT: 8080
              DB_USERNAME: postgres
              DB_PASSWORD: postgres # Nem vai ser usado
              DB_DATABASE: animesdb
            run: |
             docker run -d --name smoke-test -p 8080:8080 \
             -e DB_HOST=$DB_HOST -e DB_PORT=$DB_PORT -e DB_USERNAME=$DB_USERNAME \
             -e DB_PASSWORD=$DB_PASSWORD -e DB_DATABASE=$DB_DATABASE \
             ${{ env.DOCKER_USERNAME }}/go-api:${{ github.sha }}
             sleep 5
             curl --fail http://127.0.0.1/health | grep -q "{"status":"ok"}"
             docker rm -f smoke-test

          - name: Push na imagem
            uses: docker/build-push-action@v3
            with:
                file: ./app/dockerfile
                push: true
                tags: |
                 ${{ env.DOCKER_USERNAME }}/go-api:${{ github.sha }}
                 ${{ env.DOCKER_USERNAME }}/go-api:latest
                 ghcr.io/${{ github.repository_owner }}/go-api:${{ github.sha }}
                 ghcr.io/${{ github.repository_owner }}/go-api:latest
                context: ./app
                cache-from: type=gha
                cache-to: type=gha,mode=max
    
      